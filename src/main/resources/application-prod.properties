# Production profile configurations
server.address=${SERVER_ADDRESS:0.0.0.0}
socketio.host=${SOCKETIO_HOST:0.0.0.0}

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Structured Logging for Log Aggregation (JSON)
logging.structured.format.console=ecs

# In production, Actuator is secured except for health, info, prometheus
management.endpoints.web.exposure.include=health,info,prometheus

# Render terminates TLS at a proxy, so the socket address is the proxy's.
# Key rate-limit buckets on the forwarded client IP, and give the demo's
# one-click role switcher enough login headroom.
rate-limiting.trust-all-proxies=${RATE_LIMIT_TRUST_ALL_PROXIES:true}
rate-limiting.auth.capacity=${RATE_LIMIT_AUTH_CAPACITY:20}
